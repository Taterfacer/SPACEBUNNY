[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacebunny"
version = "1.2.0"
description = "A CodeRabbit GUI Utility - PyQt5 desktop application for code review automation"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Joshua Alexander", email = "joshua@taterfacer.com" }
]
keywords = ["coderabbit", "gui", "pyqt5", "code-review", "git"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.8"
dependencies = [
    "PyQt5>=5.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/TaterFacer/SpaceBunny"
Repository = "https://github.com/TaterFacer/SpaceBunny.git"
Issues = "https://github.com/TaterFacer/SpaceBunny/issues"

[project.scripts]
spacebunny = "SpaceBunny:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
